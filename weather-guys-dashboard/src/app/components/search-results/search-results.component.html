<div class="container">
  <h2>Search Results for "{{ query }}"</h2>

  <div *ngIf="loading">Loading results...</div>

  <table *ngIf="results.length > 0" class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Event</th>
        <th>Description</th>
        <th>Date</th>
        <th>Location</th>
        <th>Source</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let result of results">
        <td>{{ result.id }}</td>
        <td>{{ result.event }}</td>
        <td>{{ result.description }}</td>
        <td>{{ result.date }}</td>
        <td>{{ result.location }}</td>
        <td>{{ result.source }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && results.length === 0">No results found.</p>
</div>
